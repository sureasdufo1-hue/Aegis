%YAML 1.1
---
# ==============================================================================
# Suricata 8.0.6 Baseline Configuration for SOC Detection & Monitoring Lab
# Reference: SOC Architecture HLD v1.0 / LLD v1.0 / Implementation Plan Phase 10
# Completion Gate: GATE-SURI-01
# ==============================================================================

vars:
  address-groups:
    HOME_NET: "[10.77.30.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
    HTTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
    DNS_SERVERS: "$HOME_NET"

  port-groups:
    HTTP_PORTS: "80,8080,8000,3000,8501,8443,443"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22

default-log-dir: /var/log/suricata

stats:
  enabled: yes
  interval: 10sec

outputs:
  # 1. Fast log for quick console triage
  - fast:
      enabled: yes
      filename: fast.log
      append: yes

  # 2. EVE JSON - Structured SIEM telemetry for Wazuh 4.14.7
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      pcap-file: false
      community-id: true
      community-id-seed: 0
      types:
        - alert:
            payload: yes
            payload-buffer-size: 4kb
            payload-printable: yes
            packet: yes
            metadata: yes
            http-body: yes
            http-body-printable: yes
            tagged-packets: yes
        - anomaly:
            enabled: yes
            types:
              decode: yes
              stream: yes
              applayer: yes
        - http:
            extended: yes
            custom: [Accept, User-Agent, Host, Referer, Authorization]
        - dns:
            version: 2
            requests: yes
            responses: yes
        - tls:
            extended: yes
            custom: [subject, issuer, session_resumed, serial, fingerprint, sni, version]
        - files:
            force-magic: yes
            force-hash: [md5, sha256]
        - drop:
            alerts: yes
        - flow
        - netflow

# Passive Packet Capture Configuration (AF_PACKET)
af-packet:
  - interface: eth1
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    use-mmsg: yes
    buffer-size: 32768

# App-layer parsers
app-layer:
  protocols:
    tls:
      enabled: yes
      detection-ports:
        dp: 443
    dcerpc:
      enabled: yes
    ftp:
      enabled: yes
    ssh:
      enabled: yes
    smtp:
      enabled: yes
    imap:
      enabled: yes
    smb:
      enabled: yes
      detection-ports:
        dp: 139, 445
    nfs:
      enabled: yes
    tftp:
      enabled: yes
    dns:
      tcp:
        enabled: yes
        port: 53
      udp:
        enabled: yes
        port: 53
    http:
      enabled: yes
      memcap: 64mb

# Rule file inclusions
default-rule-path: /var/lib/suricata/rules
rule-files:
  - suricata.rules
  - /etc/suricata/rules/9000-network-recon.rules
  - /etc/suricata/rules/9010-web-attacks.rules
  - /etc/suricata/rules/9020-auth-bruteforce.rules
  - /etc/suricata/rules/9030-malware-c2.rules
