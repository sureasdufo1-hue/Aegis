[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "suricata-snort-soc-lab"
version = "0.1.0"
description = "Hands-on Security Operations Center (SOC) Lab with Suricata, Snort 3, Log Analysis, and Attack Simulation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Security Engineering Team", email = "soc@security-lab.local" }
]
keywords = ["suricata", "snort", "ids", "ips", "soc", "siem", "pcap", "log-analysis", "cybersecurity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "scapy>=2.5.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

