services:
  # ============================================================================
  # Wazuh 4.14.7 Single-Node SIEM Deployment
  # Baseline: Indexer + Manager + Dashboard on soc-wazuh-net
  # ============================================================================

  soc-wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.7
    container_name: soc-wazuh-indexer
    hostname: soc-wazuh-indexer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200" # Localhost only as per AGENTS.md contract
    environment:
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${WAZUH_INDEXER_ADMIN_PASSWORD:-SocLabSecret2026!Wazuh}"
      - "INDEXER_NAME=soc-wazuh-indexer"
      - "CLUSTER_NAME=soc-wazuh-cluster"
      - "DISCOVERY_SERVICE=soc-wazuh-indexer"
      - "NETWORK_HOST=0.0.0.0"
      - "NODE_NAME=soc-wazuh-indexer"
      - "INITIAL_MASTER_NODES=soc-wazuh-indexer"
      - "DISABLE_SECURITY_PLUGIN=false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    networks:
      - soc-wazuh-net

  soc-wazuh-manager:
    image: wazuh/wazuh-manager:4.14.7
    container_name: soc-wazuh-manager
    hostname: soc-wazuh-manager
    restart: unless-stopped
    depends_on:
      - soc-wazuh-indexer
    ports:
      - "1514:1514/tcp" # Agent Event Collection
      - "1515:1515/tcp" # Agent Enrollment
      - "127.0.0.1:55000:55000" # REST API (Localhost only)
    environment:
      - INDEXER_URL=https://soc-wazuh-indexer:9200
      - INDEXER_USER=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_ADMIN_PASSWORD:-SocLabSecret2026!Wazuh}
    volumes:
      - wazuh-manager-api-config:/var/ossec/api/configuration
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-logs:/var/ossec/logs
      - wazuh-manager-queue:/var/ossec/queue
      - wazuh-manager-var-multigroups:/var/ossec/var/multigroups
      - wazuh-manager-integrations:/var/ossec/integrations
      - wazuh-manager-active-response:/var/ossec/active-response/bin
      - wazuh-manager-agentless:/var/ossec/agentless
      - wazuh-manager-wodles:/var/ossec/wodles
      - ../../wazuh/rules/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
    networks:
      - soc-wazuh-net

  soc-wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.7
    container_name: soc-wazuh-dashboard
    hostname: soc-wazuh-dashboard
    restart: unless-stopped
    depends_on:
      - soc-wazuh-indexer
    ports:
      - "443:5601" # Web Console (HTTPS)
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_ADMIN_PASSWORD:-SocLabSecret2026!Wazuh}
      - WAZUH_INDEXER_URL=https://soc-wazuh-indexer:9200
      - OPENSEARCH_URL=https://soc-wazuh-indexer:9200
    networks:
      - soc-wazuh-net

volumes:
  wazuh-indexer-data:
  wazuh-manager-api-config:
  wazuh-manager-etc:
  wazuh-manager-logs:
  wazuh-manager-queue:
  wazuh-manager-var-multigroups:
  wazuh-manager-integrations:
  wazuh-manager-active-response:
  wazuh-manager-agentless:
  wazuh-manager-wodles:

networks:
  soc-wazuh-net:
    name: soc-wazuh-net
    driver: bridge
