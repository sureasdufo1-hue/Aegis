# ==============================================================================
# Pipeline: firewall-traffic
# Ingests Gateway nftables syslog from soc-gateway via Syslog UDP (5514/UDP)
# Target Data Stream / Index: logs-firewall.traffic-default
# ECS Specification: Elastic Common Schema v8 (network, event, observer, host)
# ==============================================================================

input {
  udp {
    port => 5514
  }
}

filter {
  # Parse RFC3164 / RFC5424 Syslog or Raw Linux Kernel nftables Log
  grok {
    match => {
      "message" => [
        # Syslog RFC3164/5424 framed kernel log (e.g. <30>Sep 22 10:15:30 soc-gateway kernel: SOC-FW-...)
        "(?:<%{POSINT:syslog_pri}>)?(?:%{SYSLOGTIMESTAMP:syslog_timestamp}|%{TIMESTAMP_ISO8601:syslog_timestamp})? ?(?:%{IPORHOST:syslog_host} )?(?:%{WORD:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: )?%{DATA:fw_prefix}:(?: IN=%{DATA:in_interface})?(?: OUT=%{DATA:out_interface})?(?: MAC=%{DATA:mac})? SRC=%{IP:src_ip} DST=%{IP:dst_ip} .*PROTO=%{WORD:proto}(?: SPT=%{INT:src_port})?(?: DPT=%{INT:dst_port})?(?: TYPE=%{INT:icmp_type})?(?: CODE=%{INT:icmp_code})?",
        # Direct raw kernel log with interfaces
        "%{DATA:fw_prefix}: IN=%{DATA:in_interface} OUT=%{DATA:out_interface} (?:MAC=%{DATA:mac} )?SRC=%{IP:src_ip} DST=%{IP:dst_ip} .*PROTO=%{WORD:proto}(?: SPT=%{INT:src_port})?(?: DPT=%{INT:dst_port})?(?: TYPE=%{INT:icmp_type})?(?: CODE=%{INT:icmp_code})?",
        # Fallback raw kernel log
        "%{DATA:fw_prefix}: .*SRC=%{IP:src_ip} DST=%{IP:dst_ip} .*PROTO=%{WORD:proto}(?: SPT=%{INT:src_port} DPT=%{INT:dst_port})?"
      ]
    }
  }

  mutate {
    add_field => {
      "[event][module]" => "nftables"
      "[event][dataset]" => "firewall.traffic"
      "[event][kind]" => "event"
      "[event][category]" => "network"
      "[observer][name]" => "soc-gateway"
      "[observer][type]" => "firewall"
      "[host][name]" => "soc-gateway"
      "[network][type]" => "ipv4"
    }
  }

  # Action & Outcome Mapping based on firewall rule prefix
  if [fw_prefix] =~ /DENY|DROP|REJECT|BLOCK/ {
    mutate {
      add_field => {
        "[event][action]" => "drop"
        "[event][outcome]" => "denied"
        "[event][type]" => "denied"
      }
    }
  } else {
    mutate {
      add_field => {
        "[event][action]" => "forward"
        "[event][outcome]" => "success"
        "[event][type]" => "allowed"
      }
    }
  }

  # Rule Name
  if [fw_prefix] {
    mutate {
      strip => [ "fw_prefix" ]
      add_field => { "[rule][name]" => "%{fw_prefix}" }
    }
  }

  # Syslog Hostname Override
  if [syslog_host] {
    mutate {
      replace => { "[host][name]" => "%{syslog_host}" }
    }
  }

  # Network 5-tuple and Interfaces
  if [src_ip] {
    mutate {
      add_field => { "[source][ip]" => "%{src_ip}" }
    }
  }
  if [src_port] {
    mutate {
      convert => { "src_port" => "integer" }
    }
    mutate {
      rename => { "src_port" => "[source][port]" }
    }
  }
  if [dst_ip] {
    mutate {
      add_field => { "[destination][ip]" => "%{dst_ip}" }
    }
  }
  if [dst_port] {
    mutate {
      convert => { "dst_port" => "integer" }
    }
    mutate {
      rename => { "dst_port" => "[destination][port]" }
    }
  }
  if [proto] {
    mutate {
      add_field => { "[network][transport]" => "%{proto}" }
    }
    mutate {
      lowercase => [ "[network][transport]" ]
    }
  }

  if [in_interface] {
    mutate {
      add_field => { "[observer][ingress][interface][name]" => "%{in_interface}" }
    }
  }
  if [out_interface] {
    mutate {
      add_field => { "[observer][egress][interface][name]" => "%{out_interface}" }
    }
  }
  if [mac] {
    mutate {
      add_field => { "[source][mac]" => "%{mac}" }
    }
  }

  if [source][ip] and [destination][ip] {
    mutate {
      add_field => { "[related][ip]" => [ "%{[source][ip]}", "%{[destination][ip]}" ] }
    }
  }

  # Timestamp Parsing
  if [syslog_timestamp] {
    date {
      match => [
        "syslog_timestamp",
        "MMM d HH:mm:ss",
        "MMM  d HH:mm:ss",
        "ISO8601"
      ]
      target => "@timestamp"
      timezone => "UTC"
    }
  }

  # Remove temporary Grok parsing fields
  mutate {
    remove_field => [
      "src_ip", "dst_ip", "src_port", "dst_port", "proto",
      "syslog_timestamp", "syslog_pri", "syslog_host", "syslog_program", "syslog_pid",
      "fw_prefix", "in_interface", "out_interface", "mac", "icmp_type", "icmp_code"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://soc-elasticsearch:9200"]
    user => "logstash_writer"
    password => "changeme_logstash_writer_2026"
    index => "logs-firewall.traffic-default"
    action => "create"
  }
}
