# ==============================================================================
# Pipeline: suricata-beats
# Ingests Suricata EVE JSON from soc-sensor via Beats (5044/TCP)
# Target Data Stream / Index: logs-suricata.eve-default
# ==============================================================================

input {
  beats {
    port => 5044
    client_inactivity_timeout => 60
  }
  tcp {
    port => 5047
    codec => json_lines
  }
}

filter {
  # If message is raw JSON string, parse it
  if [message] and ![event_type] {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }

  mutate {
    add_field => {
      "[event][module]" => "suricata"
      "[event][dataset]" => "suricata.eve"
      "[observer][name]" => "suricata"
      "[observer][type]" => "ids"
      "[host][name]" => "soc-sensor"
    }
  }

  # Map Network Fields to ECS
  if [src_ip] {
    mutate {
      add_field => {
        "[source][ip]" => "%{src_ip}"
      }
    }
  }
  if [src_port] {
    mutate {
      convert => { "src_port" => "integer" }
    }
    mutate {
      rename => { "src_port" => "[source][port]" }
    }
  }
  if [dest_ip] {
    mutate {
      add_field => {
        "[destination][ip]" => "%{dest_ip}"
      }
    }
  }
  if [dest_port] {
    mutate {
      convert => { "dest_port" => "integer" }
    }
    mutate {
      rename => { "dest_port" => "[destination][port]" }
    }
  }
  if [proto] {
    mutate {
      add_field => { "[network][transport]" => "%{proto}" }
    }
    mutate {
      lowercase => [ "[network][transport]" ]
    }
  }
  if [app_proto] {
    mutate {
      add_field => { "[network][protocol]" => "%{app_proto}" }
    }
    mutate {
      lowercase => [ "[network][protocol]" ]
    }
  }
  if [community_id] {
    mutate {
      add_field => { "[network][community_id]" => "%{community_id}" }
    }
  }

  # Map Related IPs
  if [source][ip] and [destination][ip] {
    mutate {
      add_field => { "[related][ip]" => [ "%{[source][ip]}", "%{[destination][ip]}" ] }
    }
  }

  # Suricata Alert Normalization
  if [event_type] == "alert" {
    mutate {
      add_field => {
        "[event][kind]" => "alert"
        "[event][category]" => "intrusion_detection"
        "[event][action]" => "alert"
      }
    }
    if [alert][signature] {
      mutate {
        add_field => { "[rule][name]" => "%{[alert][signature]}" }
      }
    }
    if [alert][signature_id] {
      mutate {
        add_field => { "[rule][id]" => "%{[alert][signature_id]}" }
      }
    }
    if [alert][category] {
      mutate {
        add_field => { "[rule][category]" => "%{[alert][category]}" }
      }
    }
    if [alert][metadata][attack_technique] {
      mutate {
        add_field => {
          "[threat][framework]" => "MITRE ATT&CK"
          "[threat][technique][id]" => "%{[alert][metadata][attack_technique][0]}"
        }
      }
    } else if [alert][metadata][mitre_technique_id] {
      mutate {
        add_field => {
          "[threat][framework]" => "MITRE ATT&CK"
          "[threat][technique][id]" => "%{[alert][metadata][mitre_technique_id]}"
        }
      }
    }
    if [alert][severity] {
      if [alert][severity] == 1 {
        mutate { add_field => { "[event][severity]" => 4 } }
      } else if [alert][severity] == 2 {
        mutate { add_field => { "[event][severity]" => 3 } }
      } else if [alert][severity] == 3 {
        mutate { add_field => { "[event][severity]" => 2 } }
      } else {
        mutate { add_field => { "[event][severity]" => 1 } }
      }
      mutate {
        convert => { "[event][severity]" => "integer" }
      }
    }
  } else {
    mutate {
      add_field => {
        "[event][kind]" => "event"
        "[event][category]" => "network"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://soc-elasticsearch:9200"]
    user => "logstash_writer"
    password => "changeme_logstash_writer_2026"
    index => "logs-suricata.eve-default"
    action => "create"
  }
}
