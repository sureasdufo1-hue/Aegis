# ==============================================================================
# Pipeline: snort-alerts
# Ingests Snort 3 JSON alerts from soc-sensor via TCP (5045/TCP)
# Target Data Stream / Index: logs-snort.alert-default
# ==============================================================================

input {
  tcp {
    port => 5045
    codec => json_lines
  }
}

filter {
  # If message is raw JSON string, parse it
  if [message] and ![msg] {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }

  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZZ", "yyyy-MM-dd'T'HH:mm:ss.SSSSSS+00:00Z" ]
      target => "@timestamp"
    }
  }

  mutate {
    add_field => {
      "[event][module]" => "snort"
      "[event][dataset]" => "snort.alert"
      "[event][kind]" => "alert"
      "[event][category]" => "intrusion_detection"
      "[observer][name]" => "snort"
      "[observer][type]" => "ids"
      "[host][name]" => "soc-sensor"
    }
  }

  # Map Network Addresses
  if [src_addr] {
    mutate {
      add_field => { "[source][ip]" => "%{src_addr}" }
    }
  }
  if [src_port] {
    mutate {
      convert => { "src_port" => "integer" }
    }
    mutate {
      rename => { "src_port" => "[source][port]" }
    }
  }
  if [dst_addr] {
    mutate {
      add_field => { "[destination][ip]" => "%{dst_addr}" }
    }
  }
  if [dst_port] {
    mutate {
      convert => { "dst_port" => "integer" }
    }
    mutate {
      rename => { "dst_port" => "[destination][port]" }
    }
  }
  if [proto] {
    mutate {
      add_field => { "[network][transport]" => "%{proto}" }
    }
    mutate {
      lowercase => [ "[network][transport]" ]
    }
  }
  if [service] {
    mutate {
      add_field => { "[network][protocol]" => "%{service}" }
    }
    mutate {
      lowercase => [ "[network][protocol]" ]
    }
  }

  if [source][ip] and [destination][ip] {
    mutate {
      add_field => { "[related][ip]" => [ "%{[source][ip]}", "%{[destination][ip]}" ] }
    }
  }

  # Rule & Alert fields
  if [msg] {
    mutate {
      add_field => { "[rule][name]" => "%{msg}" }
    }
  }
  if [sid] {
    mutate {
      add_field => { "[rule][id]" => "%{sid}" }
    }
  }
  if [class] {
    mutate {
      add_field => { "[rule][category]" => "%{class}" }
    }
  }
  if [action] {
    mutate {
      add_field => { "[event][action]" => "%{action}" }
    }
  }

  # ATT&CK Technique Mapping based on signature
  if [msg] =~ /SQL Injection|Log4j/ {
    mutate {
      add_field => {
        "[threat][framework]" => "MITRE ATT&CK"
        "[threat][technique][id]" => "T1190"
      }
    }
  } else if [msg] =~ /SSH Brute Force/ {
    mutate {
      add_field => {
        "[threat][framework]" => "MITRE ATT&CK"
        "[threat][technique][id]" => "T1110.001"
      }
    }
  } else if [msg] =~ /Stealth NULL Scan|Port Scan/ {
    mutate {
      add_field => {
        "[threat][framework]" => "MITRE ATT&CK"
        "[threat][technique][id]" => "T1046"
      }
    }
  } else if [msg] =~ /Reverse Shell/ {
    mutate {
      add_field => {
        "[threat][framework]" => "MITRE ATT&CK"
        "[threat][technique][id]" => "T1059.004"
      }
    }
  } else if [msg] =~ /DNS Tunneling/ {
    mutate {
      add_field => {
        "[threat][framework]" => "MITRE ATT&CK"
        "[threat][technique][id]" => "T1071.004"
      }
    }
  } else if [msg] =~ /Nikto/ {
    mutate {
      add_field => {
        "[threat][framework]" => "MITRE ATT&CK"
        "[threat][technique][id]" => "T1595.002"
      }
    }
  }

  # Severity Mapping
  if [class] =~ /Trojan|Exploit|Administrator/ {
    mutate { add_field => { "[event][severity]" => 4 } }
  } else if [class] =~ /Web Application/ {
    mutate { add_field => { "[event][severity]" => 3 } }
  } else {
    mutate { add_field => { "[event][severity]" => 2 } }
  }
  mutate {
    convert => { "[event][severity]" => "integer" }
  }
}

output {
  elasticsearch {
    hosts => ["http://soc-elasticsearch:9200"]
    user => "logstash_writer"
    password => "changeme_logstash_writer_2026"
    index => "logs-snort.alert-default"
    action => "create"
  }
}
