# ==============================================================================
# Pipeline: wazuh-alerts
# Ingests Wazuh Manager Alerts from /var/ossec/logs/alerts/alerts.json and TCP 5046
# Target Data Stream / Index: logs-wazuh.alert-default
# ECS Specification: Elastic Common Schema v8 (event, rule, threat, host, observer, network)
# ==============================================================================

input {
  file {
    path => "/var/ossec/logs/alerts/alerts.json"
    codec => json
    start_position => "end"
    sincedb_path => "/usr/share/logstash/data/sincedb_wazuh"
    stat_interval => "2 second"
  }
  tcp {
    port => 5046
    codec => json_lines
  }
}

filter {
  # Stringify rule.level to safely handle Logstash Java IR comparison
  if [rule][level] {
    mutate {
      add_field => { "rule_level_str" => "%{[rule][level]}" }
    }
    # Discard low-priority noise (drop levels 0, 1, 2)
    if [rule_level_str] =~ /^(0|1|2)$/ {
      drop { }
    }
    # Severity Calculation (Wazuh 3-16 to ECS 2-4)
    if [rule_level_str] =~ /^(1[2-6])$/ {
      mutate { add_field => { "[event][severity]" => 4 } }
    } else if [rule_level_str] =~ /^(7|8|9|10|11)$/ {
      mutate { add_field => { "[event][severity]" => 3 } }
    } else {
      mutate { add_field => { "[event][severity]" => 2 } }
    }
    mutate {
      convert => { "[event][severity]" => "integer" }
      remove_field => [ "rule_level_str" ]
    }
  }

  # Parse ISO8601 Timestamp to ECS @timestamp
  if [timestamp] {
    date {
      match => [
        "timestamp",
        "ISO8601",
        "yyyy-MM-dd'T'HH:mm:ss.SSSZ",
        "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ",
        "yyyy-MM-dd'T'HH:mm:ssZ"
      ]
      target => "@timestamp"
      timezone => "UTC"
    }
  }

  mutate {
    add_field => {
      "[event][module]" => "wazuh"
      "[event][dataset]" => "wazuh.alert"
      "[event][kind]" => "alert"
      "[event][category]" => "intrusion_detection"
      "[observer][name]" => "wazuh"
      "[observer][type]" => "siem"
    }
  }

  # Map Host / Agent
  if [agent][name] {
    mutate {
      add_field => { "[host][name]" => "%{[agent][name]}" }
    }
  } else {
    mutate {
      add_field => { "[host][name]" => "soc-victim" }
    }
  }

  if [agent][ip] {
    mutate {
      add_field => { "[host][ip]" => "%{[agent][ip]}" }
    }
  }

  # Map Rule Information
  if [rule][id] {
    mutate {
      convert => { "[rule][id]" => "string" }
    }
  }
  if [rule][description] {
    mutate {
      add_field => { "[rule][name]" => "%{[rule][description]}" }
    }
  }

  # MITRE ATT&CK Mapping
  if [rule][mitre][id] {
    mutate {
      add_field => { "[threat][framework]" => "MITRE ATT&CK" }
      copy => { "[rule][mitre][id]" => "[threat][technique][id]" }
    }
  }

  # Map Network Fields from Wazuh Data
  if [data][srcip] {
    mutate { add_field => { "[source][ip]" => "%{[data][srcip]}" } }
  } else if [data][src_ip] {
    mutate { add_field => { "[source][ip]" => "%{[data][src_ip]}" } }
  } else if [srcip] {
    mutate { add_field => { "[source][ip]" => "%{srcip}" } }
  } else if [src_ip] {
    mutate { add_field => { "[source][ip]" => "%{src_ip}" } }
  }

  if [data][dstip] {
    mutate { add_field => { "[destination][ip]" => "%{[data][dstip]}" } }
  } else if [data][dst_ip] {
    mutate { add_field => { "[destination][ip]" => "%{[data][dst_ip]}" } }
  } else if [dstip] {
    mutate { add_field => { "[destination][ip]" => "%{dstip}" } }
  } else if [dst_ip] {
    mutate { add_field => { "[destination][ip]" => "%{dst_ip}" } }
  }

  if [data][srcport] {
    mutate {
      convert => { "[data][srcport]" => "integer" }
      rename => { "[data][srcport]" => "[source][port]" }
    }
  } else if [srcport] {
    mutate {
      convert => { "srcport" => "integer" }
      add_field => { "[source][port]" => "%{srcport}" }
    }
  }

  if [data][dstport] {
    mutate {
      convert => { "[data][dstport]" => "integer" }
      rename => { "[data][dstport]" => "[destination][port]" }
    }
  } else if [dstport] {
    mutate {
      convert => { "dstport" => "integer" }
      add_field => { "[destination][port]" => "%{dstport}" }
    }
  }

  # User / Identity Mapping
  if [data][dstuser] {
    mutate { add_field => { "[user][name]" => "%{[data][dstuser]}" } }
  }

  # Related IPs
  if [source][ip] and [destination][ip] {
    mutate {
      add_field => { "[related][ip]" => [ "%{[source][ip]}", "%{[destination][ip]}" ] }
    }
  } else if [source][ip] {
    mutate {
      add_field => { "[related][ip]" => [ "%{[source][ip]}" ] }
    }
  } else if [destination][ip] {
    mutate {
      add_field => { "[related][ip]" => [ "%{[destination][ip]}" ] }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://soc-elasticsearch:9200"]
    user => "logstash_writer"
    password => "changeme_logstash_writer_2026"
    index => "logs-wazuh.alert-default"
    action => "create"
  }
}
