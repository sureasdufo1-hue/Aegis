user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'ssl_protocol="$ssl_protocol" ssl_cipher="$ssl_cipher"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Upstream Backend Target (Juice Shop / Victim Web Application)
    upstream victim_backend {
        server victim-web:3000;
        keepalive 32;
    }

    # 1. HTTP Plaintext Redirect to HTTPS
    server {
        listen 80;
        server_name victim-app.soc-lab.local 10.77.30.20 localhost;
        return 301 https://$host$request_uri;
    }

    # 2. SSL Termination & TLS 1.3 Reverse Proxy
    server {
        listen 443 ssl http2;
        server_name victim-app.soc-lab.local 10.77.30.20 localhost;

        # TLS Protocols & Cipher Suites
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Reverse Proxy to Internal Victim Backend (Decrypted Plaintext HTTP)
        location / {
            proxy_pass http://victim_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-SSL-Decrypted "true";

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Health check endpoint
        location /healthz {
            access_log off;
            return 200 '{"status":"healthy","ssl_termination":true,"tls_version":"TLSv1.3"}\n';
            add_header Content-Type application/json;
        }
    }
}
