# Netplan configuration for soc-gateway (Ubuntu 22.04 Router/Firewall)
# Reference: SOC Lab LLD v1.0 & Implementation Plan Phase 4.2
network:
  version: 2
  renderer: networkd
  ethernets:
    # 1. Management Interface (Connected to soc-vsw-mgmt)
    eth0:
      match:
        name: eth0
      addresses:
        - 10.77.10.1/24

    # 2. Attack Zone Interface (Connected to soc-vsw-attack)
    eth1:
      match:
        name: eth1
      addresses:
        - 10.77.20.1/24

    # 3. Victim Zone Interface (Connected to soc-vsw-victim)
    eth2:
      match:
        name: eth2
      addresses:
        - 10.77.30.1/24
