#!/usr/sbin/nft -f
# ==============================================================================
# SOC Lab Gateway Firewall Policy (nftables)
# Baseline: Default Deny, Isolated Zones, Protected Management Network
# ==============================================================================

flush ruleset

table inet filter {
    # Flow tracking & sets
    chain input {
        type filter hook input priority filter; policy drop;

        # 1. Loopback traffic
        iif "lo" accept

        # 2. Established / Related connections
        ct state { established, related } accept
        ct state invalid drop

        # 3. ICMP Ping from Management & Victim networks for diagnostics
        ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded } accept

        # 4. SSH administration from Management Zone only
        ip saddr 10.77.10.0/24 tcp dport 22 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # 1. Established / Related connections
        ct state { established, related } accept
        ct state invalid drop

        # 2. Allow Attack Zone -> Victim Zone (Controlled test targets: HTTP, HTTPS, JuiceShop, SSH)
        ip saddr 10.77.20.20 ip daddr 10.77.30.20 tcp dport { 80, 443, 3000, 22, 8080 } accept
        ip saddr 10.77.20.20 ip daddr 10.77.30.20 ip protocol icmp accept

        # 3. Allow Victim Zone -> Wazuh SIEM Server (Management Zone: Agent event delivery)
        ip saddr 10.77.30.20 ip daddr 10.77.10.10 tcp dport { 1514, 1515 } accept

        # 4. Allow Sensor Zone -> Wazuh SIEM Server (Management Zone)
        ip saddr 10.77.10.20 ip daddr 10.77.10.10 tcp dport { 1514, 1515 } accept

        # 5. Strictly Block & Log Attack Zone -> Management Zone
        ip saddr 10.77.20.0/24 ip daddr 10.77.10.0/24 log prefix "SOC-FW-DENY-ATTACK-TO-MGMT: " drop
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
